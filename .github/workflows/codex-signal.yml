name: Codex AI Council Signal

on:
  schedule:
    # Every 15 minutes. GitHub's free scheduler is best-effort (can slip a
    # few minutes) - fine for M30/H1 swing-style signals, not for scalping.
    - cron: "*/15 * * * *"
  workflow_dispatch: {}   # lets you click "Run workflow" in the Actions tab to test on demand

permissions:
  contents: write   # needed so the workflow can commit the updated signals/*.json files

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run AI Council analysis
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
        run: python analyze.py

      - name: Commit updated signals
        run: |
          git config user.name "codex-bridge-bot"
          git config user.email "actions@users.noreply.github.com"
          git add signals/*.json
          git diff --cached --quiet || git commit -m "Update AI Council signals [skip ci]"
          git push
